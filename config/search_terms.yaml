priority_terms:
  - "Head of eCommerce"
  - "VP eCommerce"
  - "Director of Digital Commerce"
  - "General Manager, eCommerce"
  - "Director of Strategic Partnerships"
  - "Director of Retail Media Strategy"
  - "Podcast Network Executive"
  - "Head of Content Partnerships"
  - "Director of Marketplace Growth"
  - "VP Growth / Revenue Partnerships"

boolean_searches:
  - query: '("VP eCommerce" OR "Head of eCommerce" OR "Director of eCommerce") AND ("P&L" OR "omnichannel" OR "marketplace")'
    enabled: true
  - query: '("Digital Commerce" OR "eCommerce") AND ("Amazon" OR "Walmart" OR "Target" OR "Wayfair") AND ("Director" OR "VP")'
    enabled: true
  - query: '("Strategic Partnerships" OR "Business Development") AND ("podcast" OR "audio" OR "creator economy" OR "digital media")'
    enabled: true
  - query: '("Retail Media" OR "Commerce Media" OR "Marketplace Growth") AND ("Director" OR "Head" OR "VP")'
    enabled: true
  - query: '("Podcast Monetization" OR "Podcast Ad Sales" OR "Audio Partnerships") AND ("Director" OR "VP" OR "Head")'
    enabled: true
  - query: '("Brand Strategy" OR "Go-to-Market" OR "Growth Marketing") AND ("retail" OR "consumer products" OR "DTC")'
    enabled: true

