[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.10",
    "typer>=0.15",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "rich>=13.9",
    "python-dateutil>=2.9",
]

[project.scripts]
job-crawler = "job_crawler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_crawler"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]
